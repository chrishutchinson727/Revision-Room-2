name: Repair font debris

on:
  push:
    paths:
      - '.github/workflows/repair-font-debris.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply repair migration
        run: python tools/repair_font_debris.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/revision-room.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/revision-room.js
      - name: Commit repaired app
        run: |
          git config user.name "Revision Room updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Clean corrupted font metadata from stored drafts"
            git push
          fi
