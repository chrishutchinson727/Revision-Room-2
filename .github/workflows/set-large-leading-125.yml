name: Set large poem leading 1.25

on:
  push:
    paths:
      - '.github/workflows/set-large-leading-125.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/set_large_leading_125.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/revision-room.js').write_text(js)
          PY
          node --check /tmp/revision-room.js
      - name: Commit
        run: |
          git config user.name "Revision Room updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Set large poem leading to 1.25"
            git push
          fi
