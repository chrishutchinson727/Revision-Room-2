name: Apply update-current-draft feature

on:
  push:
    paths:
      - '.github/workflows/apply-update-current-draft.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply Revision Room patch
        run: python tools/apply_update_current_draft.py
      - name: Commit patched app
        run: |
          git config user.name "Revision Room updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add update-current-draft option"
            git push
          fi
