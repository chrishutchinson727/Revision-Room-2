name: Adjust poem text sizes

on:
  push:
    paths:
      - '.github/workflows/adjust-text-sizes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply size adjustment
        run: python tools/adjust_text_sizes.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/revision-room.js').write_text(js)
          PY
          node --check /tmp/revision-room.js
      - name: Commit change
        run: |
          git config user.name "Revision Room updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Reduce poem text size presets"
          git push
