name: Fix poem line-height overrides

on:
  push:
    paths:
      - '.github/workflows/fix-line-height-override.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_line_height_override.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/revision-room.js').write_text(js)
          PY
          node --check /tmp/revision-room.js
      - name: Commit
        run: |
          git config user.name "Revision Room updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix poem line-height overrides"
          git push
