name: Set large poem leading 1.40

on:
  push:
    paths:
      - '.github/workflows/set-large-leading-140.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/set_large_leading_140.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/revision-room.js').write_text(js)
          PY
          node --check /tmp/revision-room.js
      - name: Commit
        run: |
          git config user.name "Revision Room updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Set large poem leading to 1.40"
          git push
